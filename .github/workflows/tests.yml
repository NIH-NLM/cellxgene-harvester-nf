name: Tests

# Runs on every pull request and every push to main.
# Make the job "lint-stub-docs" a required status check, so a pull request
# cannot be merged while it fails.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-stub-docs:
    runs-on: ubuntu-latest
    env:
      NXF_VER: '26.04.4'        # the version this workflow was tested with

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Lint the Nextflow scripts
        run: nextflow lint .

      - name: Stub run of the whole workflow
        run: nextflow run main.nf -profile test,local -stub-run

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check that the generated Nextflow docs are up to date
        run: |
          python3 docs/parse_nf_docs.py
          git diff --exit-code -- docs/source/nextflow

      - name: Build the docs, with warnings as errors
        run: |
          pip install sphinx myst-parser sphinx-rtd-theme
          sphinx-build -W -b html docs/source docs/build/html
